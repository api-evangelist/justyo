aid: justyo
name: justyo
description: >-
  Yo (justyo.co) was a single-tap notification app and "the world's simplest API." A
  service registered an API username, received an api_token, and could push a lightweight
  "Yo" notification to a single subscriber or broadcast to all subscribers, optionally
  attaching a link, plus read the subscriber count. The Yo API had effectively one job —
  fire a push — with an api_token for auth (an OAuth 2.0 page was documented but never
  enabled) and first-party client SDKs across Python, PHP, Java, Node, Ruby, Scala and
  iOS under the github.com/YoApp organization. The Yo service is now defunct: the justyo.co
  host is suspended and its api/docs/dev subdomains no longer resolve. This API Evangelist
  profile captures the historical Yo API surface for the record.
